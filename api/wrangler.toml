# Cloudflare Workers configuration for Hour Genie API
#
# To deploy:
# 1. Install Wrangler CLI: npm install -g wrangler
# 2. Login: wrangler login
#    Wrangler uses the Cloudflare account from your login / dashboard.
#    Do not commit account_id.
# 3. Update the worker name below if needed
# 4. Deploy from the /api directory: wrangler deploy
#
# Secrets (never commit real values). See .env.example, api/.dev.vars.example,
# and api/README.md for the full list:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put STRIPE_MONTHLY_PAYMENT_LINK_ID
#   wrangler secret put STRIPE_ANNUAL_PAYMENT_LINK_ID
#   wrangler secret put SENDGRID_FROM_EMAIL
#   wrangler secret put SENDGRID_REPLY_TO_EMAIL

name = "hour-genie-api"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Build configuration
[build]
command = ""

# Cron trigger for holiday reminder emails (runs daily at 9 AM UTC)
[triggers]
crons = ["0 9 * * *"]

# account_id is not committed. After `wrangler login`, Wrangler uses the
# account from your Cloudflare session / dashboard. Set it locally only if
# you have multiple accounts and Wrangler cannot infer it.

# Keep [vars] free of secrets and account-specific IDs (Stripe payment links,
# Supabase URLs, emails). Set those with `wrangler secret put` or in
# api/.dev.vars for local development.
