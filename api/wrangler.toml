# Cloudflare Workers configuration for Hour Genie API
# 
# To deploy:
# 1. Install Wrangler CLI: npm install -g wrangler
# 2. Login: wrangler login
# 3. Update name and account_id below
# 4. Deploy from the /api directory: wrangler deploy
#
# Set environment variables using:
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY

name = "hour-genie-api"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Build configuration
[build]
command = ""

# Cron trigger for holiday reminder emails (runs daily at 9 AM UTC)
[triggers]
crons = ["0 9 * * *"]

# Uncomment and set your account_id after first deploy
account_id = "1b2262cbd1eed800ce031a5db1d238fe"

[vars]
# You can set non-sensitive vars here, but use secrets for sensitive data
# Use: wrangler secret put SECRET_NAME
SUPABASE_URL = "https://lihgqzbulvmztacjwuup.supabase.co"
STRIPE_MONTHLY_PAYMENT_LINK_ID = "plink_1SmQZxAX4klWmioiHFrWtHqU"
STRIPE_ANNUAL_PAYMENT_LINK_ID = "plink_1SmQZxAX4klWmioihtzw3HXr"
SENDGRID_FROM_EMAIL = "adam@hourgenie.com"
SENDGRID_REPLY_TO_EMAIL = "adam@hourgenie.com"

