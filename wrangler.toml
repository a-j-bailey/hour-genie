# Cloudflare Workers configuration for Hour Genie API
# 
# To deploy:
# 1. Install Wrangler CLI: npm install -g wrangler
# 2. Login: wrangler login
# 3. Update name and account_id below
# 4. Deploy: wrangler deploy
#
# Set environment variables using:
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY

name = "hour-genie-api"
main = "api/worker.ts"
compatibility_date = "2024-01-01"

# Cron trigger for holiday reminder emails (runs daily at 9 AM UTC)
[triggers]
crons = ["0 9 * * *"]

# Uncomment and set your account_id after first deploy
# account_id = "your-account-id"

[env.production]
name = "hour-genie-api"

[env.production.vars]
# You can set non-sensitive vars here, but use secrets for sensitive data
# Use: wrangler secret put SECRET_NAME

